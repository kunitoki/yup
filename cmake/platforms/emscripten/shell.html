    <style>
      /* The website's look: one black field, hairlines, small tracked capitals, YUP blue as the
         only signal color. Self contained, so the fonts are the system fallbacks. */
      :root {
        --blue: #005aff;
        --pale: #9cc2ff;
        --ink: #d8dde0;
        --outline: #59606a;
        --hairline: #22262c;
        --danger: #ff6b5a;

        --rail: 52px;
        --sans: "Helvetica Neue", Arial, sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        height: 100%;
        background: #000;
      }

      body {
        color: var(--ink);
        font: 400 13px/1.5 var(--mono);
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* The small tracked capitals used by every label and button. */
      .caps, .chip, .seg, .fps, .eject, .boot-status, .audio-hint {
        font: 500 11px/1.3 var(--sans);
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }

      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
      }

      /* ---------------------------------------------------------------- rails */

      .rail {
        position: relative;
        z-index: 2;
        flex: 0 0 auto;
        height: var(--rail);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 24px;
      }

      .rail--top { border-bottom: 1px solid var(--hairline); }

      .rail--bottom {
        justify-content: flex-end;
        border-top: 1px solid var(--hairline);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand svg {
        width: 22px;
        height: 22px;
      }

      .chips {
        display: flex;
        gap: 22px;
      }

      .chip {
        font-size: 10px;
        white-space: nowrap;
        opacity: 0.45;
      }

      .chip[data-state="on"] {
        color: var(--pale);
        opacity: 1;
      }

      .chip[data-state="off"] { opacity: 0.25; }

      /* --------------------------------------------------------------- stage */

      .stage {
        position: relative;
        z-index: 1;
        flex: 1 1 auto;
        min-height: 0;
        display: grid;
        place-items: center;
        overflow: auto;
        padding: 24px;
      }

      canvas#canvas {
        display: block;
        border: 0 none;
        background: #000;
        outline: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        opacity: 0;
        transition: opacity 1.2s ease;
        box-shadow: 0 0 0 1px var(--hairline);
      }

      body.is-running canvas#canvas { opacity: 1; }

      .audio-hint {
        position: absolute;
        z-index: 2;
        display: none;
        padding: 14px 20px;
        border: 1px solid var(--hairline);
        background: rgb(0 0 0 / 0.85);
        color: #fff;
        pointer-events: none;
      }

      body.is-running.audio-waiting .audio-hint { display: block; }

      .audio-hint::before {
        content: "";
        display: inline-block;
        width: 7px;
        height: 7px;
        margin: 0 14px 1px 0;
        border-radius: 50%;
        background: var(--blue);
        vertical-align: middle;
        animation: beat 1.4s ease-in-out infinite;
      }

      @keyframes beat {
        50% { opacity: 0.25; }
      }

      /* Full window and fullscreen: the chrome steps aside, the canvas takes over. */
      body:not([data-mode="embedded"]) .rail { display: none; }
      body:not([data-mode="embedded"]) .stage {
        padding: 0;
        overflow: hidden;
      }

      /* Positioned against the stage so both percentages resolve against a definite
         box: as a centered grid item the canvas would fall back to its own aspect
         ratio and overflow the viewport. */
      body:not([data-mode="embedded"]) canvas#canvas {
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        box-shadow: none;
      }

      /* --------------------------------------------------------------- eject */

      .eject {
        position: fixed;
        top: 22px;
        right: 24px;
        z-index: 3;
        display: none;
        color: var(--ink);
        opacity: 0.35;
        transition: opacity 0.2s ease;
      }

      body:not([data-mode="embedded"]) .eject { display: block; }

      .eject:hover, .eject:focus-visible { opacity: 1; }

      /* ---------------------------------------------------------------- boot */

      .boot {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 28px;
        pointer-events: none;
        transition: opacity 0.5s ease;
      }

      body.is-running .boot {
        opacity: 0;
        visibility: hidden;
      }

      .boot svg {
        width: 72px;
        height: 72px;
      }

      .boot svg .dot { animation: beat 1.4s ease-in-out infinite; }

      /* A hairline that fills in blue once the download size is known. */
      .progress {
        width: 220px;
        height: 1px;
        background: var(--hairline);
        overflow: hidden;
      }

      .progress span {
        display: block;
        height: 100%;
        background: var(--blue);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.22s ease;
      }

      body:not(.is-determinate) .progress span {
        width: 30%;
        transform: none;
        animation: sweep 1.6s ease-in-out infinite;
      }

      @keyframes sweep {
        from { margin-left: -30%; }
        to { margin-left: 100%; }
      }

      .boot-status {
        display: flex;
        align-items: baseline;
        gap: 14px;
        font-size: 10px;
        color: var(--ink);
        opacity: 0.55;
      }

      #percent {
        color: var(--pale);
        font-variant-numeric: tabular-nums;
      }

      #percent:empty { display: none; }

      body.has-error .boot-status { opacity: 1; }
      body.has-error #status { color: var(--danger); }
      body.has-error .progress,
      body.has-error .boot svg .dot { visibility: hidden; }

      /* ------------------------------------------------------------ controls */

      .controls {
        display: flex;
        align-items: center;
        gap: 36px;
        transition: opacity 0.3s ease;
      }

      body:not(.is-running) .controls {
        opacity: 0.35;
        pointer-events: none;
      }

      .segmented {
        display: inline-flex;
        gap: 22px;
      }

      .seg {
        font-size: 10px;
        color: var(--ink);
        opacity: 0.45;
        transition: opacity 0.2s ease;
      }

      .seg:hover { opacity: 1; }

      .seg[aria-pressed="true"] {
        color: var(--pale);
        opacity: 1;
      }

      .pacing {
        display: inline-flex;
        align-items: baseline;
        gap: 22px;
      }

      .pacing[hidden] { display: none; }

      .fps {
        display: inline-flex;
        align-items: baseline;
        gap: 8px;
        font-size: 10px;
        transition: opacity 0.2s ease;
      }

      .fps span { opacity: 0.45; }

      .fps input {
        width: 5ch;
        padding: 2px 0;
        border: 0;
        border-bottom: 1px solid var(--outline);
        border-radius: 0;
        background: transparent;
        color: #fff;
        font: 13px/1.2 var(--mono);
        font-variant-numeric: tabular-nums;
        text-align: right;
        outline: none;
        appearance: textfield;
        -moz-appearance: textfield;
      }

      .fps input:focus { border-bottom-color: var(--pale); }

      .fps input::-webkit-inner-spin-button,
      .fps input::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      .fps:has(input:disabled) { opacity: 0.45; }

      :focus-visible {
        outline: 1px solid var(--pale);
        outline-offset: 4px;
      }

      @media (max-width: 780px) {
        .rail { padding: 0 14px; gap: 10px; }
        .chips { gap: 12px; }
        #chip-isolation, #chip-threads { display: none; }
        .controls, .pacing { gap: 16px; }
        .segmented { gap: 14px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>

    <script type='text/javascript'>
      var statusElement = document.getElementById('status');
      var percentElement = document.getElementById('percent');
      var progressElement = document.getElementById('progress');
      var ejectElement = document.getElementById('eject');
      var audioChipElement = document.getElementById('chip-audio');
      var midiChipElement = document.getElementById('chip-midi');

      function setAudioState(state) {
        var isOn = state === 'on';
        var isWaiting = state === 'waiting';
        var label = isOn ? 'audio on' : isWaiting ? 'audio waiting' : 'audio off';
        audioChipElement.textContent = label;
        audioChipElement.dataset.state = isOn ? 'on' : isWaiting ? 'pending' : 'off';
        document.body.classList.toggle('audio-waiting', isWaiting);
      }

      function pollAudioState() {
        var context = Module.yupAudioContext;
        setAudioState (!context || context.state === 'closed'
                         ? 'off'
                         : context.state === 'running' ? 'on' : 'waiting');
      }

      function pollMidiState() {
        setMidiState (Module.yupMidiAccess ? 'on' : Module.yupMidiRequestPending ? 'requesting' : 'off');
      }

      function setMidiState(state) {
        var isOn = state === 'on';
        var isRequesting = state === 'requesting';
        midiChipElement.textContent = isOn ? 'midi on' : isRequesting ? 'midi requesting' : 'midi off';
        midiChipElement.dataset.state = isOn ? 'on' : isRequesting ? 'pending' : 'off';
      }

      (function reportRuntime() {
        var isolation = document.getElementById('chip-isolation');
        var isolated = (typeof crossOriginIsolated !== 'undefined') && crossOriginIsolated;
        isolation.textContent = isolated ? 'isolated' : 'not isolated';
        isolation.dataset.state = isolated ? 'on' : 'off';

        var cores = navigator.hardwareConcurrency || 1;
        document.getElementById('chip-threads').textContent = cores + ' threads';
      })();

      // ---------------------------------------------------------- display modes

      var layoutMode = 'embedded';

      function isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
      }

      function applyMode(mode) {
        if (document.body.dataset.mode === 'embedded' && mode !== 'embedded')
          rememberEmbeddedSize();
        document.body.dataset.mode = mode;
        ejectElement.textContent = mode === 'fullscreen' ? 'Exit fullscreen' : 'Exit full window';
        document.querySelectorAll('.seg[data-mode]').forEach(function (button) {
          button.setAttribute('aria-pressed', String(button.dataset.mode === mode));
        });
        window.dispatchEvent(new Event('resize'));
      }

      function setMode(mode) {
        if (mode === 'fullscreen') {
          var root = document.documentElement;
          var request = (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
          if (request && request.catch)
            request.catch(function (e) { console.warn('Fullscreen request denied: ' + e); });
          return;
        }

        layoutMode = mode;

        if (isFullscreen())
          (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        else
          applyMode(mode);
      }

      function onFullscreenChange() {
        applyMode(isFullscreen() ? 'fullscreen' : layoutMode);
      }

      document.querySelectorAll('.seg[data-mode]').forEach(function (button) {
        button.addEventListener('click', function () { setMode(button.dataset.mode); });
      });

      ejectElement.addEventListener('click', function () { setMode('embedded'); });

      document.addEventListener('fullscreenchange', onFullscreenChange);
      document.addEventListener('webkitfullscreenchange', onFullscreenChange);

      // ---------------------------------------------------------- window size

      // Outside embedded mode the window takes the size the canvas is laid out at, so its pixels are
      // rendered at that size instead of stretched; back in embedded mode it gets its own size again.
      var embeddedSize = null;

      function rememberEmbeddedSize() {
        var canvas = document.getElementById('canvas');
        if (canvas.clientWidth > 0 && canvas.clientHeight > 0)
          embeddedSize = [canvas.clientWidth, canvas.clientHeight];
      }

      function fitWindowToMode() {
        if (!runtimeReady || typeof Module._yupSetPrimaryWindowSize !== 'function')
          return;

        if (document.body.dataset.mode !== 'embedded') {
          var stage = document.querySelector('.stage');
          Module._yupSetPrimaryWindowSize(Math.round(stage.clientWidth), Math.round(stage.clientHeight));
        } else if (embeddedSize) {
          Module._yupSetPrimaryWindowSize(embeddedSize[0], embeddedSize[1]);
          embeddedSize = null;
        }
      }

      window.addEventListener('resize', fitWindowToMode);

      // ---------------------------------------------------------- frame pacing

      var pacingElement = document.getElementById('pacing');
      var vsyncElement = document.getElementById('vsync');
      var fpsElement = document.getElementById('fps');
      var runtimeReady = false;
      var shownVsync = null;

      // The exports only exist in GUI applications, and calling one before the runtime is up aborts
      function pacingVsyncState() {
        if (!runtimeReady || typeof Module._yupIsVsyncEnabled !== 'function')
          return -1;
        return Module._yupIsVsyncEnabled();
      }

      function pollFramePacing() {
        var state = pacingVsyncState();
        if (state < 0)
          return;

        var vsync = state === 1;
        pacingElement.hidden = false;
        vsyncElement.setAttribute('aria-pressed', String(vsync));
        fpsElement.disabled = vsync;

        // While editable the field belongs to the user, only refresh it when vsync turns off
        if (vsync) {
          var currentRate = Module._yupGetCurrentFrameRate();
          if (currentRate > 0)
            fpsElement.value = Math.round(currentRate);
        } else if (shownVsync !== false) {
          fpsElement.value = Math.round(Module._yupGetDesiredFrameRate());
        }

        shownVsync = vsync;
      }

      vsyncElement.addEventListener('click', function () {
        var state = pacingVsyncState();
        if (state < 0)
          return;
        Module._yupSetVsyncEnabled(state === 1 ? 0 : 1);
        pollFramePacing();
      });

      // SDL listens for keys on the window and cancels the ones it handles, keep typing here away from it
      ['keydown', 'keyup', 'keypress'].forEach(function (type) {
        fpsElement.addEventListener(type, function (e) { e.stopPropagation(); });
      });

      fpsElement.addEventListener('change', function () {
        if (pacingVsyncState() < 0)
          return;
        var rate = parseInt(fpsElement.value, 10);
        if (rate > 0)
          Module._yupSetDesiredFrameRate(Math.min(rate, 1000));
        fpsElement.value = Math.round(Module._yupGetDesiredFrameRate());
      });

      // -------------------------------------------------------------- progress

      function setProgress(ratio) {
        if (ratio === null) {
          document.body.classList.remove('is-determinate');
          percentElement.textContent = '';
          return;
        }
        var clamped = Math.max(0, Math.min(1, ratio));
        document.body.classList.add('is-determinate');
        progressElement.style.transform = 'scaleX(' + clamped.toFixed(3) + ')';
        percentElement.textContent = Math.round(clamped * 100) + '%';
      }

      var totalDependencies = 0;

      var Module = {
        preRun: [
          function () {
            if (typeof navigator === 'undefined' || !navigator.gpu)
              return;
            addRunDependency('webgpu-device');
            var requestedCompatibility = false;
            navigator.gpu.requestAdapter().then(function (adapter) {
              if (adapter != null)
                return adapter;

              // Compatibility mode runs on older GPUs and on browsers implementing WebGPU over OpenGL ES
              requestedCompatibility = true;
              return navigator.gpu.requestAdapter({ featureLevel: 'compatibility' });
            }).then(function (adapter) {
              if (adapter == null) throw new Error('WebGPU: no adapter');
              return adapter.requestDevice();
            }).then(function (device) {
              // An adapter returned for a compatibility request may still give a full (core) device
              Module.webGPUCompatibilityMode = requestedCompatibility && !device.features.has('core-features-and-limits');
              Module.preinitializedWebGPUDevice = device;
              removeRunDependency('webgpu-device');
            }).catch(function (e) {
              console.error('WebGPU initialization failed: ' + e);
              removeRunDependency('webgpu-device');
            });
          }
        ],
        postRun: [
          function () { runtimeReady = true; }
        ],
        print: (function() {
          return function(text) {
            if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
            console.log(text);
          };
        })(),
        canvas: (() => {
          var canvas = document.getElementById('canvas');
          canvas.addEventListener("webglcontextlost", (e) => { alert('WebGL context lost. You will need to reload the page.'); e.preventDefault(); }, false);
          return canvas;
        })(),
        setStatus: (text) => {
          if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (m && now - Module.setStatus.last.time < 30) return;
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;
          if (m) {
            setProgress(parseFloat(m[2]) / parseFloat(m[4]));
            text = m[1].trim();
          } else {
            setProgress(null);
          }
          statusElement.textContent = text;
          if (!text) document.body.classList.add('is-running');
        },
        monitorRunDependencies: (left) => {
          totalDependencies = Math.max(totalDependencies, left);
          Module.setStatus(left ? 'Preparing (' + (totalDependencies - left) + '/' + totalDependencies + ')' : 'Starting');
        }
      };
      pollMidiState();
      pollAudioState();
      window.setInterval(function () {
        pollAudioState();
        pollMidiState();
        pollFramePacing();
      }, 250);
      Module.setStatus('Downloading module');
      window.onerror = (event) => {
        document.body.classList.add('has-error');
        Module.setStatus('Runtime error. Check the browser console.');
        Module.setStatus = (text) => {
          if (text) console.error('[post-exception status] ' + text);
        };
      };
    </script>
