<!doctype html>
<html lang="en">
    <head>
        <!-- Cross-origin isolation for the threaded YUP module; must run before anything else loads. -->
        <script src="./mini-coi.js"></script>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="color-scheme" content="dark" />
        <meta name="theme-color" content="#000000" />
        <link rel="icon" type="image/svg+xml" href="../../logo.svg" />
        <link rel="stylesheet" href="./home.css" />
        <script type="module" src="./home.js"></script>
        <title>YUP! The GPU-first framework for realtime audio and graphics</title>
        <meta name="description" content="YUP is an ISC licensed, GPU-first C++20 framework where realtime audio and graphics meet. Build native applications, audio tools and plugins for desktop, mobile and the web, and ship them on your own terms." />
    </head>
    <body>
        <canvas id="canvas" tabindex="-1" aria-hidden="true" oncontextmenu="event.preventDefault()"></canvas>

        <div class="mask" aria-hidden="true">
            <div class="leak"></div>
        </div>

        <main>
            <h1 class="sr-only">YUP!</h1>
            <ol class="works" aria-label="Works">
                <li><a href="#facet" data-note="knobs that fold into a dodecahedron">facet</a></li>
                <li><a href="#keys" data-note="piano keys that rise under your hand">keys</a></li>
                <li><a href="#reel" data-note="a list that bends toward you or away">reel</a></li>
                <li><a href="#layers" data-note="a settings panel that comes apart in depth">layers</a></li>
                <li><a href="#ripple" data-note="a mixer under liquid glass">ripple</a></li>
                <li><a href="./get-started.html" data-note="build your first yup app" data-page>start</a></li>
            </ol>
            <p class="readout" aria-live="polite"></p>
        </main>

        <!-- @chrome -->
        <p class="what">a c++ library where sound and graphics are one material.</p>
        <button class="corner bottom-right back" type="button">back</button>

        <p class="boot" role="status"><span class="boot-text">yup&nbsp;&nbsp;warming up</span><span class="boot-cursor">_</span></p>
    </body>
</html>
