<!doctype html>
<html lang="en">
    <head>
        <!-- GitHub Pages serves this page for any missing path, so relative URLs resolve from the root. -->
        <base href="/" />
        <!-- @head -->
        <title>Page not found - YUP!</title>
        <meta name="robots" content="noindex" />
    </head>
    <body>
        <!-- @header -->

        <main>
            <section class="relative overflow-hidden py-20 sm:py-28">
                <div class="bg-grid"></div>
                <div class="container-site relative text-center">
                    <button class="orbit mx-auto block cursor-pointer" type="button" data-trombone aria-label="Play a sad trombone">
                        <svg viewBox="0 0 120 120" aria-hidden="true">
                            <g transform="rotate(-24 60 60)">
                                <path class="track" pathLength="100" d="M 8 60 a 52 28 0 1 0 104 0 a 52 28 0 1 0 -104 0" />
                                <path class="arc" pathLength="100" d="M 8 60 a 52 28 0 1 0 104 0 a 52 28 0 1 0 -104 0" />
                                <circle class="dot" r="3.4">
                                    <animateMotion dur="2.8s" repeatCount="indefinite" rotate="auto" path="M 8 60 a 52 28 0 1 0 104 0 a 52 28 0 1 0 -104 0" />
                                </circle>
                            </g>
                            <path class="dart" transform="rotate(-12 60 60) translate(36 37) scale(2)" d="M12 2 21 21 12 16.4 3 21Z" />
                        </svg>
                    </button>
                    <p class="eyebrow mt-8">Error 404</p>
                    <h1 class="mx-auto mt-4 max-w-3xl text-4xl font-semibold tracking-tight text-balance sm:text-5xl">Lost in orbit</h1>
                    <p class="lead mx-auto mt-5 max-w-xl">This page drifted off the signal path. It may have moved, or it never existed. Tap the logo for a proper sendoff, then head somewhere that does exist.</p>
                    <div class="mt-9 flex flex-wrap items-center justify-center gap-3">
                        <a class="btn btn-primary" href="./index.html">Back to home</a>
                        <button class="btn btn-ghost" type="button" data-search-open>Search the docs</button>
                        <a class="btn btn-ghost" href="https://kunitoki.github.io/yup-demos/demos/ydsp-synths/" target="_blank" rel="noopener" data-goatcounter-click="run-live-404">Run live</a>
                    </div>
                </div>
            </section>
        </main>

        <!-- @footer -->

        <script type="module">
            let audio;

            // Four falling sawtooth notes through a resonant lowpass, the last one with vibrato.
            document.querySelector("[data-trombone]").addEventListener("click", () => {
                audio ??= new AudioContext();
                const filter = new BiquadFilterNode(audio, { type: "lowpass", frequency: 1400, Q: 4 });
                filter.connect(new GainNode(audio, { gain: 0.15 })).connect(audio.destination);

                [233.08, 220, 207.65, 196].forEach((frequency, i) => {
                    const start = audio.currentTime + i * 0.5;
                    const length = i === 3 ? 1.4 : 0.42;
                    const voice = new OscillatorNode(audio, { type: "sawtooth", frequency });
                    const envelope = new GainNode(audio, { gain: 0 });

                    envelope.gain.setTargetAtTime(1, start, 0.02);
                    envelope.gain.setTargetAtTime(0, start + length - 0.08, 0.05);
                    voice.connect(envelope).connect(filter);
                    voice.start(start);
                    voice.stop(start + length + 0.3);

                    if (i === 3) {
                        const vibrato = new OscillatorNode(audio, { frequency: 5 });
                        vibrato.connect(new GainNode(audio, { gain: 4 })).connect(voice.frequency);
                        vibrato.start(start);
                        vibrato.stop(start + length + 0.3);
                    }
                });
            });
        </script>
    </body>
</html>
