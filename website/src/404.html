<!doctype html>
<html lang="en">
    <head>
        <!-- GitHub Pages serves this page for any missing path, so relative URLs resolve from the root. -->
        <base href="/" />
        <!-- @head -->
        <title>Page not found - YUP!</title>
        <meta name="robots" content="noindex" />
    </head>
    <body>
        <!-- @chrome -->
        <!-- @nav -->

        <main class="sheet">
            <h1 class="title">lost</h1>
            <p class="crt">yup&nbsp;&nbsp;signal lost<span>_</span></p>
            <p class="lead">Error 404. This page drifted off the signal path: it may have moved, or it never existed.</p>
            <div class="actions">
                <a href="./index.html">back to yup</a>
                <button type="button" data-search-open>search the docs</button>
                <button type="button" data-trombone>play a sad trombone</button>
            </div>
        </main>

        <!-- @footer -->
        <script type="module">
            let audio;

            // Four falling sawtooth notes through a resonant lowpass, the last one with vibrato.
            document.querySelector("[data-trombone]").addEventListener("click", () => {
                audio ??= new AudioContext();
                const filter = new BiquadFilterNode(audio, { type: "lowpass", frequency: 1400, Q: 4 });
                filter.connect(new GainNode(audio, { gain: 0.15 })).connect(audio.destination);

                [233.08, 220, 207.65, 196].forEach((frequency, i) => {
                    const start = audio.currentTime + i * 0.5;
                    const length = i === 3 ? 1.4 : 0.42;
                    const voice = new OscillatorNode(audio, { type: "sawtooth", frequency });
                    const envelope = new GainNode(audio, { gain: 0 });

                    envelope.gain.setTargetAtTime(1, start, 0.02);
                    envelope.gain.setTargetAtTime(0, start + length - 0.08, 0.05);
                    voice.connect(envelope).connect(filter);
                    voice.start(start);
                    voice.stop(start + length + 0.3);

                    if (i === 3) {
                        const vibrato = new OscillatorNode(audio, { frequency: 5 });
                        vibrato.connect(new GainNode(audio, { gain: 4 })).connect(voice.frequency);
                        vibrato.start(start);
                        vibrato.stop(start + length + 0.3);
                    }
                });
            });
        </script>
    </body>
</html>
