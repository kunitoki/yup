name: Android

# See https://medium.com/@dcostalloyd90/automating-android-builds-with-github-actions-a-step-by-step-guide-2a02a54f59cd

on:
  workflow_call:
    inputs:
      test_modules:
        description: Semicolon-separated YUP_TEST_MODULES value (empty builds every module's tests)
        type: string
        default: ""
      tests:
        description: Whether to build the tests (they are not run)
        type: boolean
        default: false
      examples:
        description: JSON array of the examples to build
        type: string
        default: "[]"

env:
  ACTION_RUNNER: github-actions
  JAVA_VERSION: 17
  JAVA_DISTRIBUTION: 'temurin'
  NDK_VERSION: r27c
  ANDROID_ABI: arm64-v8a
  ANDROID_PLATFORM: android-21
  INSTALL_DEPS: >-
    libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev
    libx11-dev libxcomposite-dev libxcursor-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev
    libxrandr-dev libxrender-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev
    libglu1-mesa-dev libegl1-mesa-dev mesa-common-dev

jobs:
  configure:
    runs-on: ubuntu-latest
    if: inputs.examples != '[]'
    steps:
      - uses: actions/checkout@v6
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y ${INSTALL_DEPS}
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{env.JAVA_DISTRIBUTION}}
          java-version: ${{env.JAVA_VERSION}}
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{env.NDK_VERSION}}
      - name: Configure
        run: cmake ${{ github.workspace }} -G "Ninja Multi-Config" -B ${{ runner.workspace }}/build -DYUP_TARGET_ANDROID=ON -DYUP_BUILD_EXAMPLES=ON
      - name: Cache Configure
        id: cache-build
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.workspace }}/build
          key: android-build-${{ github.sha }}-${{ github.run_id }}

  # The gradle projects only build examples, the test runners configure directly with the NDK toolchain
  build_tests:
    runs-on: ubuntu-latest
    if: inputs.tests
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
    - uses: actions/checkout@v6
    - uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: android-tests-${{ matrix.config }}
        max-size: 1G
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools
    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: ${{env.NDK_VERSION}}
    - name: Configure
      run: |
        cmake ${{ github.workspace }} -G "Ninja Multi-Config" -B ${{ runner.workspace }}/build \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=${{ env.ANDROID_ABI }} -DANDROID_PLATFORM=${{ env.ANDROID_PLATFORM }} -DANDROID_STL=c++_shared \
          -DANDROID_CPP_FEATURES="rtti exceptions" -DYUP_ANDROID_ASSETS_DIR=${{ runner.workspace }}/build/assets \
          -DYUP_BUILD_TESTS=ON -DYUP_BUILD_EXAMPLES=OFF -DYUP_TEST_MODULES="${{ inputs.test_modules }}"
    # Built only, the runners need a device or emulator to run
    - run: cmake --build ${{ runner.workspace }}/build --config ${{ matrix.config }} --target yup_tests

  build_examples:
    runs-on: ubuntu-latest
    needs: [configure]
    if: inputs.examples != '[]'
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(inputs.examples) }}
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
    - uses: actions/checkout@v6
    - uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: android-example-${{ matrix.example }}
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: ${{env.JAVA_DISTRIBUTION}}
        java-version: ${{env.JAVA_VERSION}}
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: |
          platform-tools
          cmake;3.22.1
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: ${{env.NDK_VERSION}}
    - uses: actions/cache/restore@v5
      id: cache-restore
      with:
        path: ${{ runner.workspace }}/build
        key: android-build-${{ github.sha }}-${{ github.run_id }}
    - name: Configure If Cache Missed
      if: steps.cache-restore.outputs.cache-hit != 'true'
      run: cmake ${{ github.workspace }} -G "Ninja Multi-Config" -B ${{ runner.workspace }}/build -DYUP_TARGET_ANDROID=ON -DYUP_BUILD_EXAMPLES=ON
    - working-directory: ${{ runner.workspace }}/build/examples/${{ matrix.example }}
      run: ./gradlew assembleDebug
    - working-directory: ${{ runner.workspace }}/build/examples/${{ matrix.example }}
      run: ./gradlew assemble
