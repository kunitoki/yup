name: Android

# See https://medium.com/@dcostalloyd90/automating-android-builds-with-github-actions-a-step-by-step-guide-2a02a54f59cd

on:
  workflow_call:
    inputs:
      examples:
        description: JSON array of the examples to build
        type: string
        default: "[]"

env:
  ACTION_RUNNER: github-actions
  JAVA_VERSION: 17
  JAVA_DISTRIBUTION: 'temurin'
  NDK_VERSION: r27c
  INSTALL_DEPS: >-
    libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev
    libx11-dev libxcomposite-dev libxcursor-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev
    libxrandr-dev libxrender-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev
    libglu1-mesa-dev libegl1-mesa-dev mesa-common-dev

jobs:
  configure:
    runs-on: ubuntu-latest
    if: inputs.examples != '[]'
    steps:
      - uses: actions/checkout@v6
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y ${INSTALL_DEPS}
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: ${{env.JAVA_DISTRIBUTION}}
          java-version: ${{env.JAVA_VERSION}}
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{env.NDK_VERSION}}
      - name: Configure
        run: cmake ${{ github.workspace }} -G "Ninja Multi-Config" -B ${{ runner.workspace }}/build -DYUP_TARGET_ANDROID=ON -DYUP_BUILD_EXAMPLES=ON
      - name: Cache Configure
        id: cache-build
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.workspace }}/build
          key: android-build-${{ github.sha }}-${{ github.run_id }}

  build_examples:
    runs-on: ubuntu-latest
    needs: [configure]
    if: inputs.examples != '[]'
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(inputs.examples) }}
    steps:
    - uses: actions/checkout@v6
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: ${{env.JAVA_DISTRIBUTION}}
        java-version: ${{env.JAVA_VERSION}}
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: ${{env.NDK_VERSION}}
    - uses: actions/cache/restore@v5
      id: cache-restore
      with:
        path: ${{ runner.workspace }}/build
        key: android-build-${{ github.sha }}-${{ github.run_id }}
    - name: Configure If Cache Missed
      if: steps.cache-restore.outputs.cache-hit != 'true'
      run: cmake ${{ github.workspace }} -G "Ninja Multi-Config" -B ${{ runner.workspace }}/build -DYUP_TARGET_ANDROID=ON -DYUP_BUILD_EXAMPLES=ON
    - working-directory: ${{ runner.workspace }}/build/examples/${{ matrix.example }}
      run: ./gradlew assembleDebug
    - working-directory: ${{ runner.workspace }}/build/examples/${{ matrix.example }}
      run: ./gradlew assemble
