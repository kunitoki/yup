name: Wasm

on:
  workflow_call:
    inputs:
    test_modules:
      description: Semicolon-separated YUP_TEST_MODULES value (empty builds every module's tests)
      type: string
      default: ""
    tests:
      description: Whether to build and run the tests
      type: boolean
      default: false
    examples:
      description: JSON array of the examples to build
      type: string
      default: "[]"
    example_targets:
      description: JSON object mapping each example to its space-separated build targets
      type: string
      default: "{}"

env:
  ACTION_RUNNER: github-actions
  INSTALL_DEPS: >-
    libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev
    libx11-dev libxcomposite-dev libxcursor-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev
    libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev
  EM_VERSION: 4.0.21
  EMCC_SKIP_SANITY_CHECK: 1

jobs:
  build_tests:
    runs-on: ubuntu-latest
    if: inputs.tests
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
    - uses: actions/checkout@v6
    - run: sudo apt-get update && sudo apt-get install -y ${INSTALL_DEPS}
    - name: Setup emsdk
      uses: mymindstorm/setup-emsdk@v15
      with:
        version: ${{ env.EM_VERSION }}
    - name: Configure
      run: |
        emcmake cmake ${{ github.workspace }} -G "Ninja Multi-Config" -B ${{ runner.workspace }}/build \
          -DYUP_BUILD_TESTS=ON -DYUP_BUILD_EXAMPLES=OFF -DYUP_TEST_MODULES="${{ inputs.test_modules }}"
    - run: cmake --build ${{ runner.workspace }}/build --config ${{ matrix.config }} --target yup_tests
    - working-directory: ${{ runner.workspace }}/build/tests/${{ matrix.config }}
      run: node yup_tests.js

  build_examples:
    runs-on: ubuntu-latest
    if: inputs.examples != '[]'
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(inputs.examples) }}
    steps:
    - uses: actions/checkout@v6
    - run: sudo apt-get update && sudo apt-get install -y ${INSTALL_DEPS}
    - name: Setup emsdk
      uses: mymindstorm/setup-emsdk@v15
      with:
        version: ${{ env.EM_VERSION }}
    - name: Configure
      run: emcmake cmake ${{ github.workspace }} -G "Ninja Multi-Config" -B ${{ runner.workspace }}/build -DYUP_BUILD_TESTS=OFF -DYUP_BUILD_EXAMPLES=ON
    - run: cmake --build ${{ runner.workspace }}/build --config Debug --target ${{ fromJson(inputs.example_targets)[matrix.example] }}
    - run: cmake --build ${{ runner.workspace }}/build --config Release --target ${{ fromJson(inputs.example_targets)[matrix.example] }}
