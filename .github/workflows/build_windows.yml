name: Windows

on:
  workflow_call:
    inputs:
      test_modules:
        description: Semicolon-separated YUP_TEST_MODULES value (empty builds every module's tests)
        type: string
        default: ""
      tests:
        description: Whether to build and run the tests
        type: boolean
        default: false
      python:
        description: Whether to build and test the python wheels
        type: boolean
        default: false
      examples:
        description: JSON array of the examples to build
        type: string
        default: "[]"
      example_targets:
        description: JSON object mapping each example to its space-separated build targets
        type: string
        default: "{}"

env:
  ACTION_RUNNER: github-actions

jobs:
  build_tests:
    runs-on: windows-latest
    if: inputs.tests
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
    - uses: actions/checkout@v6
    - run: cmake ${{ github.workspace }} -B ${{ runner.workspace }}/build -DYUP_BUILD_TESTS=ON -DYUP_BUILD_EXAMPLES=ON '-DYUP_TEST_MODULES=${{ inputs.test_modules }}'
    - run: cmake --build ${{ runner.workspace }}/build --config ${{ matrix.config }} --target yup_tests
    - working-directory: ${{ runner.workspace }}/build/tests/${{ matrix.config }}
      run: ./yup_tests.exe
      shell: bash

  build_examples:
    runs-on: windows-latest
    if: inputs.examples != '[]'
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(inputs.examples) }}
    steps:
    - uses: actions/checkout@v6
    - run: cmake ${{ github.workspace }} -B ${{ runner.workspace }}/build -DYUP_BUILD_TESTS=OFF -DYUP_BUILD_EXAMPLES=ON
    - run: cmake --build ${{ runner.workspace }}/build --config Debug --target ${{ fromJson(inputs.example_targets)[matrix.example] }}
    - run: cmake --build ${{ runner.workspace }}/build --config Release --target ${{ fromJson(inputs.example_targets)[matrix.example] }}

  build_python:
    name: build_cp${{matrix.python}}-${{ matrix.platform_id }}
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    if: inputs.python

    strategy:
      fail-fast: true
      matrix:
        include:
        - { os: windows-latest, python: 311, platform_id: win_amd64, cibw_archs: AMD64 }
        - { os: windows-latest, python: 311, platform_id: win_arm64, cibw_archs: ARM64 }

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup and install python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Build wheels
      uses: pypa/cibuildwheel@v3.0.0
      env:
        CIBW_ARCHS: ${{matrix.cibw_archs}}
        CIBW_BUILD: cp${{ matrix.python }}-${{ matrix.platform_id }}
        CIBW_TEST_SKIP: "*-win_arm64"
        CIBW_DEBUG_TRACEBACK: TRUE
        CIBW_ENVIRONMENT: CIBW_DEBUG_TRACEBACK=TRUE
      with:
        package-dir: python

    - name: Store failures artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: compare-data-${{ matrix.platform_id }}
        path: |
          python/tests/compare_data/
          !python/tests/compare_data/.gitignore
        if-no-files-found: ignore
        retention-days: 5
        compression-level: 0
        overwrite: true
