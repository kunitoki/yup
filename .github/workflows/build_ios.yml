name: iOS

on:
  push:
    paths:
      - "CMakeLists.txt"
      - "**/workflows/build_ios.yml"
      - "**/.github/actions/smart_ci/**"
      - "**/.github/tools/smart_ci.py"
      - "**/.github/smart_ci_config.json"
      - "**/cmake/**"
      - "**/examples/**"
      - "**/modules/**"
      - "**/tests/**"
      - "**/thirdparty/**"
      - "!**/LICENSE*"
      - "!**/native/generated/**"
      - "!**/native/java*/**"
      - "!**/native/*_android.*"
      - "!**/native/*_emscripten.*"
      - "!**/native/*_linux.*"
      - "!**/native/*_mac.*"
      - "!**/native/*_wasm.*"
      - "!**/native/*_windows.*"
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      base:
        description: Base ref/sha to diff against (empty uses origin/main, or builds everything on main)
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ACTION_RUNNER: github-actions
  IOS_PLATFORM: OS64

jobs:
  determine-components:
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.smart-ci.outputs.examples }}
      example_targets: ${{ steps.smart-ci.outputs.example_targets }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - id: smart-ci
      uses: ./.github/actions/smart_ci
      with:
        platform: ios
        base: ${{ inputs.base }}

  configure:
    runs-on: macos-latest
    needs: [determine-components]
    if: needs.determine-components.outputs.examples != '[]'
    steps:
    - uses: actions/checkout@v6
    - name: Configure
      run: |
        cmake ${{ github.workspace }} -G "Ninja Multi-Config" -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/ios.cmake \
          -DPLATFORM=${{ env.IOS_PLATFORM }} -B ${{ runner.workspace }}/build -DYUP_BUILD_EXAMPLES=ON
    - name: Build SDL
      run: |
        cmake --build ${{ runner.workspace }}/build --config Debug --target SDL3-static
        cmake --build ${{ runner.workspace }}/build --config Release --target SDL3-static
    - name: Cache Configure
      id: cache-build
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.workspace }}/build
        key: ios-build-${{ github.sha }}-${{ github.run_id }}

  build_examples:
    runs-on: macos-latest
    needs: [determine-components, configure]
    if: needs.determine-components.outputs.examples != '[]'
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.determine-components.outputs.examples) }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/cache/restore@v5
      id: cache-restore
      with:
        path: ${{ runner.workspace }}/build
        key: ios-build-${{ github.sha }}-${{ github.run_id }}
    - name: Configure If Cache Missed
      if: steps.cache-restore.outputs.cache-hit != 'true'
      run: |
        cmake ${{ github.workspace }} -G "Ninja Multi-Config" -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/ios.cmake \
          -DPLATFORM=${{ env.IOS_PLATFORM }} -B ${{ runner.workspace }}/build -DYUP_BUILD_EXAMPLES=ON
    - run: cmake --build ${{ runner.workspace }}/build --config Debug --target ${{ fromJson(needs.determine-components.outputs.example_targets)[matrix.example] }}
    - run: cmake --build ${{ runner.workspace }}/build --config Release --target ${{ fromJson(needs.determine-components.outputs.example_targets)[matrix.example] }}
