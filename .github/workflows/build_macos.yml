name: MacOS

on:
  workflow_call:
    inputs:
      test_modules:
        description: Semicolon-separated YUP_TEST_MODULES value (empty builds every module's tests)
        type: string
        default: ""
      tests:
        description: Whether to build and run the tests
        type: boolean
        default: false
      python:
        description: Whether to build and test the python wheels
        type: boolean
        default: false
      examples:
        description: JSON array of the examples to build
        type: string
        default: "[]"
      example_targets:
        description: JSON object mapping each example to its space-separated build targets
        type: string
        default: "{}"

env:
  ACTION_RUNNER: github-actions

jobs:
  configure:
    runs-on: macos-latest
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_OBJC_COMPILER_LAUNCHER: ccache
      CMAKE_OBJCXX_COMPILER_LAUNCHER: ccache
    steps:
    - uses: actions/checkout@v6
    - uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: macos-configure
    - name: Configure
      run: |
        cmake ${{ github.workspace }} -G "Ninja Multi-Config" -B ${{ runner.workspace }}/build \
          -DYUP_BUILD_TESTS=ON -DYUP_BUILD_EXAMPLES=ON -DYUP_TEST_MODULES="${{ inputs.test_modules }}"
    - name: Build SDL
      run: |
        cmake --build ${{ runner.workspace }}/build --config Debug --target SDL3-static
        cmake --build ${{ runner.workspace }}/build --config Release --target SDL3-static
    - name: Cache Configure
      id: cache-build
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.workspace }}/build
        key: macos-build-${{ github.sha }}-${{ github.run_id }}

  build_tests:
    runs-on: macos-latest
    needs: [configure]
    if: inputs.tests
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_OBJC_COMPILER_LAUNCHER: ccache
      CMAKE_OBJCXX_COMPILER_LAUNCHER: ccache
    steps:
    - uses: actions/checkout@v6
    - uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: macos-tests-${{ matrix.config }}
        max-size: 1G
    - uses: actions/cache/restore@v5
      id: cache-restore
      with:
        path: ${{ runner.workspace }}/build
        key: macos-build-${{ github.sha }}-${{ github.run_id }}
    - name: Configure If Cache Missed
      if: steps.cache-restore.outputs.cache-hit != 'true'
      run: |
        cmake ${{ github.workspace }} -G "Ninja Multi-Config" -B ${{ runner.workspace }}/build \
          -DYUP_BUILD_TESTS=ON -DYUP_BUILD_EXAMPLES=ON -DYUP_TEST_MODULES="${{ inputs.test_modules }}"
    - run: cmake --build ${{ runner.workspace }}/build --config ${{ matrix.config }} --target yup_tests
    - working-directory: ${{ runner.workspace }}/build/tests/${{ matrix.config }}
      run: ./yup_tests.app/Contents/MacOS/yup_tests

  build_examples:
    runs-on: macos-latest
    needs: [configure]
    if: inputs.examples != '[]'
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(inputs.examples) }}
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_OBJC_COMPILER_LAUNCHER: ccache
      CMAKE_OBJCXX_COMPILER_LAUNCHER: ccache
    steps:
    - uses: actions/checkout@v6
    - uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: macos-example-${{ matrix.example }}
    - uses: actions/cache/restore@v5
      id: cache-restore
      with:
        path: ${{ runner.workspace }}/build
        key: macos-build-${{ github.sha }}-${{ github.run_id }}
    - name: Configure If Cache Missed
      if: steps.cache-restore.outputs.cache-hit != 'true'
      run: |
        cmake ${{ github.workspace }} -G "Ninja Multi-Config" -B ${{ runner.workspace }}/build \
          -DYUP_BUILD_TESTS=ON -DYUP_BUILD_EXAMPLES=ON -DYUP_TEST_MODULES="${{ inputs.test_modules }}"
    - run: cmake --build ${{ runner.workspace }}/build --config Debug --target ${{ fromJson(inputs.example_targets)[matrix.example] }}
    - run: cmake --build ${{ runner.workspace }}/build --config Release --target ${{ fromJson(inputs.example_targets)[matrix.example] }}

  build_python:
    name: build_cp${{matrix.python}}-${{ matrix.platform_id }}
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    if: inputs.python

    strategy:
      fail-fast: true
      matrix:
        include:
        - { os: macos-latest, python: 311, platform_id: macosx_universal2, cibw_archs: universal2 }

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup and install python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Build wheels
      uses: pypa/cibuildwheel@v3.0.0
      env:
        CIBW_ARCHS: ${{matrix.cibw_archs}}
        CIBW_BUILD: cp${{ matrix.python }}-${{ matrix.platform_id }}
        #CIBW_TEST_SKIP: "*-macosx_x86_64 *-macosx_universal2:x86_64"
        CIBW_DEBUG_TRACEBACK: TRUE
        CIBW_ENVIRONMENT: |
          CIBW_DEBUG_TRACEBACK=TRUE MACOSX_DEPLOYMENT_TARGET=11.0 YUP_OSX_DEPLOYMENT_TARGET=11.0 YUP_OSX_ARCHITECTURES="x86_64;arm64"
      with:
        package-dir: python

    - name: Store failures artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: compare-data-${{ matrix.platform_id }}
        path: |
          python/tests/compare_data/
          !python/tests/compare_data/.gitignore
        if-no-files-found: ignore
        retention-days: 5
        compression-level: 0
        overwrite: true
