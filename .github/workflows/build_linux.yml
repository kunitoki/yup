name: Linux

on:
  workflow_call:
    inputs:
      test_modules:
        description: Semicolon-separated YUP_TEST_MODULES value (empty builds every module's tests)
        type: string
        default: ""
      tests:
        description: Whether to build and run the tests
        type: boolean
        default: false
      python:
        description: Whether to build and test the python wheels
        type: boolean
        default: false
      examples:
        description: JSON array of the examples to build
        type: string
        default: "[]"
      example_targets:
        description: JSON object mapping each example to its space-separated build targets
        type: string
        default: "{}"

env:
  ACTION_RUNNER: github-actions
  INSTALL_DEPS: >-
    libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev
    libx11-dev libxcomposite-dev libxcursor-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev
    libxrandr-dev libxrender-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev
    libglu1-mesa-dev libegl1-mesa-dev mesa-common-dev libgl1-mesa-dri mesa-utils xvfb glibc-tools
  LIBGL_ALWAYS_SOFTWARE: "1"
  GALLIUM_DRIVER: "llvmpipe"

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Dependencies
      run: sudo apt-get update && sudo apt-get install -y ${INSTALL_DEPS}
    - name: Test OpenGL Version
      run: xvfb-run glxinfo | grep "OpenGL version"
    - name: Configure
      run: |
        cmake ${{ github.workspace }} -G "Ninja Multi-Config" -B ${{ runner.workspace }}/build \
          -DYUP_BUILD_TESTS=ON -DYUP_BUILD_EXAMPLES=ON -DYUP_TEST_MODULES="${{ inputs.test_modules }}"
    - name: Build SDL
      run: |
        cmake --build ${{ runner.workspace }}/build --config Debug --target SDL3-static
        cmake --build ${{ runner.workspace }}/build --config Release --target SDL3-static
    - name: Cache Configure
      id: cache-build
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.workspace }}/build
        key: linux-build-${{ github.sha }}-${{ github.run_id }}

  build_tests:
    runs-on: ubuntu-latest
    needs: [configure]
    if: inputs.tests
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
    - uses: actions/checkout@v6
    - run: sudo apt-get update && sudo apt-get install -y ${INSTALL_DEPS}
    - uses: actions/cache/restore@v5
      id: cache-restore
      with:
        path: ${{ runner.workspace }}/build
        key: linux-build-${{ github.sha }}-${{ github.run_id }}
    - name: Configure If Cache Missed
      if: steps.cache-restore.outputs.cache-hit != 'true'
      run: |
        cmake ${{ github.workspace }} -G "Ninja Multi-Config" -B ${{ runner.workspace }}/build \
          -DYUP_BUILD_TESTS=ON -DYUP_BUILD_EXAMPLES=ON -DYUP_TEST_MODULES="${{ inputs.test_modules }}"
    - run: cmake --build ${{ runner.workspace }}/build --config ${{ matrix.config }} --target yup_tests
    - working-directory: ${{ runner.workspace }}/build/tests/${{ matrix.config }}
      run: xvfb-run -a catchsegv ./yup_tests

  build_examples:
    runs-on: ubuntu-latest
    needs: [configure]
    if: inputs.examples != '[]'
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(inputs.examples) }}
    steps:
    - uses: actions/checkout@v6
    - run: sudo apt-get update && sudo apt-get install -y ${INSTALL_DEPS}
    - uses: actions/cache/restore@v5
      id: cache-restore
      with:
        path: ${{ runner.workspace }}/build
        key: linux-build-${{ github.sha }}-${{ github.run_id }}
    - name: Configure If Cache Missed
      if: steps.cache-restore.outputs.cache-hit != 'true'
      run: |
        cmake ${{ github.workspace }} -G "Ninja Multi-Config" -B ${{ runner.workspace }}/build \
          -DYUP_BUILD_TESTS=ON -DYUP_BUILD_EXAMPLES=ON -DYUP_TEST_MODULES="${{ inputs.test_modules }}"
    - run: cmake --build ${{ runner.workspace }}/build --config Debug --target ${{ fromJson(inputs.example_targets)[matrix.example] }}
    - run: cmake --build ${{ runner.workspace }}/build --config Release --target ${{ fromJson(inputs.example_targets)[matrix.example] }}

  build_python:
    name: build_cp${{matrix.python}}-${{ matrix.platform_id }}
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    if: inputs.python

    strategy:
      fail-fast: true
      matrix:
        include:
        - { os: ubuntu-latest, python: 311, platform_id: manylinux_x86_64, cibw_archs: x86_64 }
        #- { os: ubuntu-latest, python: 311, platform_id: manylinux_aarch64, cibw_archs: aarch64 }

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up QEMU
      if: matrix.cibw_archs == 'aarch64'
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Setup and install python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Build wheels
      uses: pypa/cibuildwheel@v3.0.0
      env:
        CIBW_ARCHS: ${{matrix.cibw_archs}}
        CIBW_BUILD: cp${{ matrix.python }}-${{ matrix.platform_id }}
        CIBW_TEST_SKIP: "*-manylinux_aarch64"
        CIBW_DEBUG_TRACEBACK: TRUE
        CIBW_ENVIRONMENT: CIBW_DEBUG_TRACEBACK=TRUE
      with:
        package-dir: python

    - name: Store failures artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: compare-data-${{ matrix.platform_id }}
        path: |
          ./python/wheelhouse/compare_data/
          !./python/wheelhouse/compare_data/.gitignore
        if-no-files-found: ignore
        retention-days: 5
        compression-level: 0
        overwrite: true
