name: Linux

on:
  push:
    paths:
      - "CMakeLists.txt"
      - "**/workflows/build_linux.yml"
      - "**/.github/actions/smart_ci/**"
      - "**/.github/tools/smart_ci.py"
      - "**/.github/smart_ci_config.json"
      - "**/cmake/**"
      - "**/examples/**"
      - "**/modules/**"
      - "**/python/**"
      - "**/tests/**"
      - "**/thirdparty/**"
      - "!**/LICENSE*"
      - "!**/native/generated/**"
      - "!**/native/java*/**"
      - "!**/native/*_android.*"
      - "!**/native/*_apple.*"
      - "!**/native/*_emscripten.*"
      - "!**/native/*_ios*.*"
      - "!**/native/*_mac.*"
      - "!**/native/*_wasm.*"
      - "!**/native/*_windows.*"
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      base:
        description: Base ref/sha to diff against (empty uses origin/main, or builds everything on main)
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ACTION_RUNNER: github-actions
  INSTALL_DEPS: >-
    libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev
    libx11-dev libxcomposite-dev libxcursor-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev
    libxrandr-dev libxrender-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev
    libglu1-mesa-dev libegl1-mesa-dev mesa-common-dev libgl1-mesa-dri mesa-utils xvfb glibc-tools
  LIBGL_ALWAYS_SOFTWARE: "1"
  GALLIUM_DRIVER: "llvmpipe"

jobs:
  determine-components:
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.smart-ci.outputs.any }}
      test_modules: ${{ steps.smart-ci.outputs.test_modules }}
      tests: ${{ steps.smart-ci.outputs.full_build == 'true' || steps.smart-ci.outputs.test_modules != '' }}
      examples: ${{ steps.smart-ci.outputs.examples }}
      example_targets: ${{ steps.smart-ci.outputs.example_targets }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - id: smart-ci
      uses: ./.github/actions/smart_ci
      with:
        platform: linux
        base: ${{ inputs.base }}

  configure:
    runs-on: ubuntu-latest
    needs: [determine-components]
    if: needs.determine-components.outputs.any == 'true'
    steps:
    - uses: actions/checkout@v6
    - name: Install Dependencies
      run: sudo apt-get update && sudo apt-get install -y ${INSTALL_DEPS}
    - name: Test OpenGL Version
      run: xvfb-run glxinfo | grep "OpenGL version"
    - name: Configure
      run: |
        cmake ${{ github.workspace }} -G "Ninja Multi-Config" -B ${{ runner.workspace }}/build \
          -DYUP_BUILD_TESTS=ON -DYUP_BUILD_EXAMPLES=ON -DYUP_TEST_MODULES="${{ needs.determine-components.outputs.test_modules }}"
    - name: Build SDL
      run: |
        cmake --build ${{ runner.workspace }}/build --config Debug --target SDL3-static
        cmake --build ${{ runner.workspace }}/build --config Release --target SDL3-static
    - name: Cache Configure
      id: cache-build
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.workspace }}/build
        key: linux-build-${{ github.sha }}-${{ github.run_id }}

  build_tests:
    runs-on: ubuntu-latest
    needs: [determine-components, configure]
    if: needs.determine-components.outputs.tests == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
    - uses: actions/checkout@v6
    - run: sudo apt-get update && sudo apt-get install -y ${INSTALL_DEPS}
    - uses: actions/cache/restore@v5
      id: cache-restore
      with:
        path: ${{ runner.workspace }}/build
        key: linux-build-${{ github.sha }}-${{ github.run_id }}
    - name: Configure If Cache Missed
      if: steps.cache-restore.outputs.cache-hit != 'true'
      run: |
        cmake ${{ github.workspace }} -G "Ninja Multi-Config" -B ${{ runner.workspace }}/build \
          -DYUP_BUILD_TESTS=ON -DYUP_BUILD_EXAMPLES=ON -DYUP_TEST_MODULES="${{ needs.determine-components.outputs.test_modules }}"
    - run: cmake --build ${{ runner.workspace }}/build --config ${{ matrix.config }} --target yup_tests
    - working-directory: ${{ runner.workspace }}/build/tests/${{ matrix.config }}
      run: xvfb-run -a catchsegv ./yup_tests

  build_examples:
    runs-on: ubuntu-latest
    needs: [determine-components, configure]
    if: needs.determine-components.outputs.examples != '[]'
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.determine-components.outputs.examples) }}
    steps:
    - uses: actions/checkout@v6
    - run: sudo apt-get update && sudo apt-get install -y ${INSTALL_DEPS}
    - uses: actions/cache/restore@v5
      id: cache-restore
      with:
        path: ${{ runner.workspace }}/build
        key: linux-build-${{ github.sha }}-${{ github.run_id }}
    - name: Configure If Cache Missed
      if: steps.cache-restore.outputs.cache-hit != 'true'
      run: |
        cmake ${{ github.workspace }} -G "Ninja Multi-Config" -B ${{ runner.workspace }}/build \
          -DYUP_BUILD_TESTS=ON -DYUP_BUILD_EXAMPLES=ON -DYUP_TEST_MODULES="${{ needs.determine-components.outputs.test_modules }}"
    - run: cmake --build ${{ runner.workspace }}/build --config Debug --target ${{ fromJson(needs.determine-components.outputs.example_targets)[matrix.example] }}
    - run: cmake --build ${{ runner.workspace }}/build --config Release --target ${{ fromJson(needs.determine-components.outputs.example_targets)[matrix.example] }}
