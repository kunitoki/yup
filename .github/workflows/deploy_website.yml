name: Website

on:
  push:
    paths:
      - "**/workflows/deploy_website.yml"
      - "website/**"
      - "docs/**"
      - "logos/*.svg"
      - "CMakeLists.txt"
      - "cmake/**"
      - "modules/**"
      - "thirdparty/**"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  INSTALL_DEPS: >-
    libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev
    libx11-dev libxcomposite-dev libxcursor-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev
    libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev
  EM_VERSION: 4.0.21
  EMCC_SKIP_SANITY_CHECK: 1

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: sudo apt-get update && sudo apt-get install -y ${INSTALL_DEPS}

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v15
        with:
          version: ${{ env.EM_VERSION }}

      # Builds website_demos, which copies its .js and .wasm into website/src/public/yup for Vite
      - name: Build home page demos
        working-directory: ${{ github.workspace }}
        run: |
          emcmake cmake ${{ github.workspace }} -G "Ninja Multi-Config" -B ${{ runner.workspace }}/build -DYUP_BUILD_TESTS=OFF -DYUP_BUILD_EXAMPLES=ON
          cmake --build ${{ runner.workspace }}/build --config Release --target website_demos
          ls -l website/src/public/yup

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build website
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
