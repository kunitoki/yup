# Publishes the YUI extension of modules/yup_gui_markup/tools/vscode-yui to the Visual Studio Marketplace.
#
# It publishes with Trusted Publishing, so there is no token to store. Set up once, at
# https://marketplace.visualstudio.com/manage:
#   - the publisher that "publisher" names in the package.json of the extension;
#   - under its "Trusted Publishing", a policy for the repository owner "kunitoki", the repository "yup"
#     and the workflow "deploy_vscode.yml", with no environment.
#
# The Marketplace refuses a version it already has: raise "version" in the package.json first.

name: VSCode Extension

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vscode
  cancel-in-progress: false

jobs:
  # The tool and the extension are built and tested as on every change of the tooling, then packaged
  build:
    uses: ./.github/workflows/yui_tooling.yml
    with:
      package: true

  # Only this job can publish, and it builds nothing: it takes the package as it was made, and publishes it with
  # the vsce the package-lock.json of the extension holds
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: modules/yup_gui_markup/tools/vscode-yui
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: modules/yup_gui_markup/tools/vscode-yui

      - uses: actions/download-artifact@v8
        with:
          name: vscode-yui
          path: modules/yup_gui_markup/tools/vscode-yui

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modules/yup_gui_markup/tools/vscode-yui/package-lock.json

      - name: Install vsce
        run: npm ci

      - name: Publish to the Visual Studio Marketplace
        run: npx --no-install vsce publish --oidc --packagePath vscode-yui.vsix
