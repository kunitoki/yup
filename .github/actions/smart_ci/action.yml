name: Smart CI
description: >-
  Compute the tests and examples a platform must build for the current ref. Branches
  diff against their merge-base with origin/main, main always builds everything.
  Needs a checkout with full history (fetch-depth 0).

inputs:
  platform:
    description: Platform from the 'platforms' section of .github/smart_ci_config.json
    required: true
  base:
    description: Base ref/sha to diff against, overriding the default
    required: false
    default: ""

outputs:
  any:
    description: Whether anything must be built at all
    value: ${{ steps.set-outputs.outputs.any }}
  full_build:
    description: Whether everything must be built
    value: ${{ steps.set-outputs.outputs.full_build }}
  test_modules:
    description: Semicolon-separated YUP_TEST_MODULES value (empty builds every module's tests)
    value: ${{ steps.set-outputs.outputs.test_modules }}
  examples:
    description: JSON array of the examples to build
    value: ${{ steps.set-outputs.outputs.examples }}
  example_targets:
    description: JSON object mapping each example to its space-separated build targets
    value: ${{ steps.set-outputs.outputs.example_targets }}

runs:
  using: composite
  steps:
  - name: Run Smart CI
    shell: bash
    env:
      PLATFORM: ${{ inputs.platform }}
      BASE: ${{ inputs.base }}
    run: |
      if [ -n "$BASE" ]; then
        SCOPE=(--base "$BASE")
      elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
        SCOPE=(--full)
      else
        SCOPE=(--base origin/main)
      fi
      python3 .github/tools/smart_ci.py "${SCOPE[@]}" --platform "$PLATFORM" \
        --config .github/smart_ci_config.json --output "$RUNNER_TEMP/affected.json"

  - name: Set outputs
    id: set-outputs
    shell: bash
    run: |
      AFFECTED="$RUNNER_TEMP/affected.json"
      ANY=$(jq -r '.full_build or (.tests | length > 0) or (.examples | length > 0)' "$AFFECTED")
      {
        echo "any=$ANY"
        echo "full_build=$(jq -r '.full_build' "$AFFECTED")"
        echo "test_modules=$(jq -r '.tests | join(";")' "$AFFECTED")"
        echo "examples=$(jq -c '.examples' "$AFFECTED")"
        echo "example_targets=$(jq -c '.example_targets' "$AFFECTED")"
      } >> "$GITHUB_OUTPUT"
